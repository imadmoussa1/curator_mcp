[project]
name = "life-os-mcp"
version = "0.2.0"
description = "Personal Entertainment OS - Model Context Protocol (MCP) server & data ingestion pipeline with Google Cloud Firestore"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "firebase-admin>=6.5.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["importers", "services"]
